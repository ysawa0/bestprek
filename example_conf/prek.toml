[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]

[[repos]]
repo = "https://github.com/ysawa0/bestprek"
rev = "1.34"

[[repos.hooks]]
id = "oxfmt"

[[repos.hooks]]
id = "oxlint"

[[repos.hooks]]
id = "ruff-format"

[[repos.hooks]]
id = "ruff-check"

[[repos.hooks]]
id = "unslop"

[[repos.hooks]]
id = "markdown-length"

[[repos.hooks]]
id = "markdown-width"
# args = ["--max-chars", "300"]

[[repos.hooks]]
id = "markdown-links"

[[repos.hooks]]
id = "directory-file-count"
exclude = "(^|/)(archive|fixtures|profiles|check-evidence)/"
# args = ["--max-files", "20"]

[[repos.hooks]]
id = "goimports"

[[repos.hooks]]
id = "gofumpt"

[[repos.hooks]]
id = "gopls-check"

[[repos.hooks]]
id = "go-vet"

[[repos.hooks]]
id = "gocyclo"

[[repos.hooks]]
id = "revive"

[[repos.hooks]]
id = "shfmt"

[[repos.hooks]]
id = "shellcheck"

[[repos.hooks]]
id = "cargo-fmt"

[[repos.hooks]]
id = "cargo-clippy"
