line-length = 300

[lint]
select = ["ALL"]
# Formatting belongs to ruff-format. Use first-line docstrings (D212).
# https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
ignore = [
  "COM812", "COM819", "D203", "D206", "D213", "D300",
  "E111", "E114", "E117", "ISC002",
  "Q000", "Q001", "Q002", "Q003", "Q004", "W191",
]

[lint.pylint]
max-nested-blocks = 2

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
