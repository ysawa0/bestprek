repos:
  - repo: https://github.com/ysawa0/precommit
    rev: "1.10"
    hooks:
      - id: oxfmt
        exclude: '(^|/)(dist|build|coverage|vendor|\.cache|cache|__pycache__|generated)/'
      - id: oxlint
      - id: ruff-format
      - id: ruff-check
      - id: unbold
      - id: goimports
      - id: gofumpt
      - id: gopls-check
      - id: go-vet
      - id: shfmt
      - id: shellcheck
