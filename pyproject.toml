[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ysawa0-prek-hooks"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "ruff==0.16.1",
  "shellcheck-py==0.11.0.1",
]

[project.scripts]
ys-ruff = "hooks.ruff:main"
ys-shellcheck = "hooks.shellcheck:main"

[tool.setuptools]
packages = ["hooks"]
