[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ysawa0-bestprek-hooks"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "markdown-it-py==4.2.0",
  "ruff==0.16.1",
  "shellcheck-py==0.11.0.1",
]

[project.scripts]
ys-ruff = "hooks.ruff:main"
ys-markdown-length = "hooks.markdown_length:main"
ys-markdown-width = "hooks.markdown_width:main"
ys-code-length = "hooks.code_length:main"
ys-markdown-links = "hooks.markdown_links:main"
ys-directory-file-count = "hooks.directory_count:main"

[tool.setuptools]
packages = ["hooks"]
