[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = "^\\.ci/fixtures/.*\\.txt$"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = "^\\.ci/fixtures/.*\\.txt$"

[[repos.hooks]]
id = "check-added-large-files"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "unbold"
name = "unbold"
entry = "go run ./tools/unbold --write"
language = "system"
types = ["markdown"]
require_serial = true

[[repos.hooks]]
id = "unslop"
name = "unslop"
entry = "python3 -m hooks.unslop"
language = "system"
types = ["markdown"]
exclude = "^\\.ci/fixtures/unslop/coffee-before\\.md$"
require_serial = true

[[repos.hooks]]
id = "gofmt"
name = "gofmt"
entry = "gofmt -w"
language = "system"
types = ["go"]
require_serial = true

[[repos.hooks]]
id = "go-vet"
name = "go vet"
entry = "go vet ./..."
language = "system"
types = ["go"]
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "go-test"
name = "go test"
entry = "go test ./..."
language = "system"
types = ["go"]
pass_filenames = false
require_serial = true
