[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = "^\\.ci/fixtures/.*\\.txt$"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = "^\\.ci/fixtures/.*\\.txt$"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]

[[repos]]
repo = "local"

# Run the published hooks from this worktree, including uncommitted changes.
[[repos.hooks]]
id = "bestprek"
name = "bestprek"
entry = "sh -c 'prek try-repo \"$PWD\" --skip directory-file-count --skip markdown-width --skip unbold --files \"$@\"' --"
language = "system"
require_serial = true

[[repos.hooks]]
id = "markdown-width"
name = "markdown width"
entry = "python3 -m hooks.markdown_width"
language = "system"
types = ["markdown"]
exclude = '^(\.agent/|\.ci/fixtures/|oxlint/anti-slop/vendor/)'

[[repos.hooks]]
id = "directory-file-count"
name = "directory file count"
entry = "python3 -m hooks.directory_count"
language = "system"
types = ["file"]
exclude = "^(\\.ci/fixtures/|\\.github/release-notes/)"
require_serial = true
