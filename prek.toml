[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-added-large-files"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "unbold"
name = "unbold"
entry = "go run ./unbold --write"
language = "system"
types = ["markdown"]
require_serial = true

[[repos.hooks]]
id = "anti-slop"
name = "anti-slop prose"
entry = "python3 -m hooks.anti_slop"
language = "system"
types = ["markdown"]
exclude = "^examples/anti-slop/coffee-before\\.md$"
require_serial = true

[[repos.hooks]]
id = "gofmt"
name = "gofmt"
entry = "gofmt -w"
language = "system"
types = ["go"]
require_serial = true

[[repos.hooks]]
id = "go-vet"
name = "go vet"
entry = "go vet ./..."
language = "system"
types = ["go"]
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "go-test"
name = "go test"
entry = "go test ./..."
language = "system"
types = ["go"]
pass_filenames = false
require_serial = true
