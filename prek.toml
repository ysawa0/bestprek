[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = "^\\.ci/fixtures/.*\\.txt$"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = "^\\.ci/fixtures/.*\\.txt$"

[[repos.hooks]]
id = "check-added-large-files"

[[repos]]
repo = "local"

# Run the published hooks from this worktree, including uncommitted changes.
[[repos.hooks]]
id = "bestprek"
name = "bestprek"
entry = "sh -c 'prek try-repo \"$PWD\" --files \"$@\"' --"
language = "system"
require_serial = true
