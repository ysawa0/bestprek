name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Test anti-slop prose linter
        run: python3 -m unittest -v test_anti_slop.py
      - name: Validate hook files
        run: |
          uvx prek==0.4.12 validate-config prek.toml
          uvx prek==0.4.12 validate-manifest .pre-commit-hooks.yaml
      - name: Check repository
        run: uvx prek==0.4.12 run --all-files
      - name: Test published hooks
        run: >-
          uvx prek==0.4.12 try-repo .
          --files
          .github/fixtures/smoke.sh
          .github/fixtures/smoke.ts
          .github/fixtures/smoke.py
          .github/fixtures/smoke.go
          examples/anti-slop/coffee-after.md

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish requested release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < RELEASE)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE must contain a version such as 1.15" >&2
            exit 1
          fi
          notes=".github/release-notes/${version}.md"
          test -f "$notes" || { echo "missing $notes" >&2; exit 1; }
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version already exists"
            exit 0
          fi
          gh release create "$version" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes-file "$notes" \
            --latest
