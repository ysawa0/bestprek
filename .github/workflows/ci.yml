name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Validate hook files
        run: |
          uvx prek==0.4.12 validate-config prek.toml
          uvx prek==0.4.12 validate-manifest .pre-commit-hooks.yaml
      - name: Check repository
        run: uvx prek==0.4.12 run --all-files
      - name: Test published hooks
        run: uvx prek==0.4.12 try-repo . --all-files
