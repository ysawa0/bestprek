- id: ruff-check
  name: ruff check
  description: "Run 'ruff check' for extremely fast Python linting"
  entry: ruff check --force-exclude
  language: system
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true

- id: ruff-format
  name: ruff format
  description: "Run 'ruff format' for extremely fast Python formatting"
  entry: ruff format --force-exclude
  language: system
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true

- id: oxfmt
  name: oxfmt
  description: "Format JavaScript, JSX, TypeScript, TSX, and JSON files with oxfmt"
  entry: oxfmt --no-error-on-unmatched-pattern
  language: system
  types_or: [javascript, jsx, ts, tsx, json]
  pass_filenames: true

- id: oxlint
  name: oxlint
  description: "Lint JavaScript, JSX, TypeScript, and TSX files with oxlint"
  entry: oxlint --deny-warnings
  language: system
  types_or: [javascript, jsx, ts, tsx]
  pass_filenames: true

- id: unbold
  name: unbold
  description: "Strip markdown bold markers (** and __) in place"
  entry: unbold --write
  language: golang
  types: [markdown]
  require_serial: true

- id: gofumpt
  name: gofumpt
  description: "Format Go files with gofumpt"
  entry: gofumpt -w
  language: system
  types: [go]
  require_serial: true

- id: goimports
  name: goimports
  description: "Format Go files and fix imports with goimports"
  entry: goimports -w
  language: system
  types: [go]
  require_serial: true

- id: gopls-check
  name: gopls check
  description: "Run gopls diagnostics for Go files"
  entry: gopls check
  language: system
  types: [go]
  pass_filenames: true
  require_serial: true

- id: go-vet
  name: go vet
  description: "Run go vet on the current Go module"
  entry: sh -c 'go vet ./...'
  language: system
  types: [go]
  pass_filenames: false
  require_serial: true

- id: shellcheck
  name: shellcheck
  description: "Run shellcheck for shell script linting"
  entry: shellcheck
  language: system
  types: [shell]
  args: [-e, SC1091]
  require_serial: true

- id: shfmt
  name: shfmt
  description: "Format shell scripts with shfmt"
  entry: shfmt -w
  language: system
  types: [shell]
  require_serial: true
