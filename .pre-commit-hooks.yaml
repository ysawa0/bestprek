- id: ruff-check
  name: ruff check
  description: "Run 'ruff check' for extremely fast Python linting"
  entry: ys-ruff check --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args:
    - --extend-select=SIM102,PLR1702
    - --preview
    - --config=lint.explicit-preview-rules=true
    - --config=lint.pylint.max-nested-blocks=2
  require_serial: true

- id: ruff-format
  name: ruff format
  description: "Run 'ruff format' for extremely fast Python formatting"
  entry: ys-ruff format --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true

- id: oxfmt
  name: oxfmt
  description: "Format JavaScript, JSX, TypeScript, TSX, and JSON files with oxfmt"
  entry: oxfmt --no-error-on-unmatched-pattern
  language: node
  language_version: "24.19.0"
  additional_dependencies: ["oxfmt@0.62.0"]
  types_or: [javascript, jsx, ts, tsx, json]
  pass_filenames: true

- id: oxlint
  name: oxlint
  description: "Lint JavaScript, JSX, TypeScript, and TSX files with the bundled oxlint policy"
  entry: ys-oxlint
  language: node
  language_version: "24.19.0"
  additional_dependencies: ["oxlint@1.80.0", "@oxlint/plugins@1.80.0"]
  types_or: [javascript, jsx, ts, tsx]
  pass_filenames: true

- id: unbold
  name: unbold
  description: "Strip markdown bold markers (** and __) in place"
  entry: unbold --write
  language: golang
  language_version: "1.26.5"
  types: [markdown]
  require_serial: true

- id: anti-slop
  name: anti-slop prose
  description: "Lint Markdown prose for canned, repetitive, bloated, or mechanically over-polished writing"
  entry: ys-anti-slop
  language: python
  types: [markdown]
  exclude: ^examples/anti-slop/coffee-before\.md$
  require_serial: true

- id: gofumpt
  name: gofumpt
  description: "Format Go files with gofumpt"
  entry: gofumpt -w
  language: golang
  language_version: "1.26.5"
  additional_dependencies: ["mvdan.cc/gofumpt@v0.11.0"]
  types: [go]
  require_serial: true

- id: goimports
  name: goimports
  description: "Format Go files and fix imports with goimports"
  entry: goimports -w
  language: golang
  language_version: "1.26.5"
  additional_dependencies: ["golang.org/x/tools/cmd/goimports@v0.48.0"]
  types: [go]
  require_serial: true

- id: gopls-check
  name: gopls check
  description: "Run gopls diagnostics for Go files"
  entry: gopls check
  language: golang
  language_version: "1.26.5"
  additional_dependencies: ["golang.org/x/tools/gopls@v0.23.0"]
  types: [go]
  pass_filenames: true
  require_serial: true

- id: go-vet
  name: go vet
  description: "Run go vet on the current Go module"
  entry: go vet ./...
  language: golang
  language_version: "1.26.5"
  types: [go]
  pass_filenames: false
  require_serial: true

- id: shellcheck
  name: shellcheck
  description: "Run shellcheck for shell script linting"
  entry: ys-shellcheck
  language: python
  types: [shell]
  args: [-e, SC1091]
  require_serial: true

- id: shfmt
  name: shfmt
  description: "Format shell scripts with shfmt"
  entry: shfmt -w
  language: golang
  language_version: "1.26.5"
  additional_dependencies: ["mvdan.cc/sh/v3/cmd/shfmt@v3.13.1"]
  types: [shell]
  require_serial: true
