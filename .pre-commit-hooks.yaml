- id: ruff-check
  name: ruff check
  description: "Run 'ruff check' for extremely fast Python linting"
  entry: ys-ruff check --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args:
    - --extend-select=SIM102,PLR1702
    - --preview
    - --config=lint.explicit-preview-rules=true
    - --config=lint.pylint.max-nested-blocks=3
  require_serial: true

- id: ruff-format
  name: ruff format
  description: "Run 'ruff format' for extremely fast Python formatting"
  entry: ys-ruff format --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true

- id: oxfmt
  name: oxfmt
  description: "Format JavaScript, JSX, TypeScript, TSX, and JSON files with oxfmt"
  entry: oxfmt --no-error-on-unmatched-pattern
  language: node
  language_version: "24.19.0"
  additional_dependencies: ["oxfmt@0.62.0"]
  types_or: [javascript, jsx, ts, tsx, json]
  pass_filenames: true

- id: oxlint
  name: oxlint
  description: "Lint JavaScript, JSX, TypeScript, and TSX files with the bundled oxlint policy"
  entry: ys-oxlint
  language: node
  language_version: "24.19.0"
  additional_dependencies: ["oxlint@1.80.0", "@oxlint/plugins@1.80.0"]
  types_or: [javascript, jsx, ts, tsx]
  pass_filenames: true

- id: oxlint-fix
  name: oxlint fix
  description: "Apply autofixes from the bundled oxlint policy; run manually"
  entry: ys-oxlint
  args: ["--fix"]
  language: node
  language_version: "24.19.0"
  additional_dependencies: ["oxlint@1.80.0", "@oxlint/plugins@1.80.0"]
  types_or: [javascript, jsx, ts, tsx]
  pass_filenames: true
  stages: [manual]

- id: unbold
  name: unbold
  description: "Strip markdown bold markers (** and __) in place"
  entry: unbold --write
  language: rust
  language_version: stable
  types: [markdown]
  require_serial: true

- id: unslop-prose
  name: unslop prose
  description: "Lint Markdown prose for canned, repetitive, bloated, or mechanically over-polished writing"
  entry: unslop
  language: rust
  language_version: stable
  types: [markdown]
  exclude: ^\.ci/fixtures/unslop-prose/coffee-before\.md$

- id: markdown-length
  name: markdown length
  description: "Reject Markdown files over 20 KB (~5k tokens); configure with --max-kb"
  entry: ys-markdown-length
  language: python
  types: [markdown]

- id: markdown-links
  name: markdown links
  description: "Check local Markdown link and image targets"
  entry: ys-markdown-links
  language: python
  types: [markdown]

- id: markdown-width
  name: markdown width
  description: "Reject Markdown lines over 300 characters; configure with --max-chars"
  entry: ys-markdown-width
  language: python
  types: [markdown]

- id: code-length
  name: code length
  description: "Reject code files over 1,000 lines; configure with --max-lines"
  entry: ys-code-length
  language: python
  types_or: [python, pyi, go, javascript, jsx, ts, tsx, rust, shell, c, c++, c#, java, kotlin, swift, ruby, php, lua, scala, vue, svelte, dart, elixir, zig, haskell, perl]

- id: directory-file-count
  name: directory file count
  description: "Reject subdirectories with more than 20 tracked files; configure with --max-files"
  entry: ys-directory-file-count
  language: python
  types: [file]
  require_serial: true

- id: gofumpt
  name: gofumpt
  description: "Format Go files with gofumpt"
  entry: gofumpt -w
  language: golang
  language_version: "1.26.5"
  additional_dependencies: ["mvdan.cc/gofumpt@v0.11.0"]
  types: [go]
  require_serial: true

- id: goimports
  name: goimports
  description: "Format Go files and fix imports with goimports"
  entry: goimports -w
  language: golang
  language_version: "1.26.5"
  additional_dependencies: ["golang.org/x/tools/cmd/goimports@v0.48.0"]
  types: [go]
  require_serial: true

- id: gopls-check
  name: gopls check
  description: "Run gopls diagnostics for Go files"
  entry: ys-gopls-check
  language: golang
  language_version: "1.26.5"
  additional_dependencies: ["golang.org/x/tools/gopls@v0.23.0"]
  types: [go]
  pass_filenames: true
  require_serial: true

- id: revive
  name: revive
  description: "Lint Go with Revive and the project's revive.toml"
  entry: revive -set_exit_status -config revive.toml
  language: golang
  language_version: "1.26.5"
  additional_dependencies: ["github.com/mgechev/revive@v1.16.0"]
  types: [go]
  pass_filenames: true

- id: shellcheck
  name: shellcheck
  description: "Run shellcheck for shell script linting"
  entry: shellcheck
  language: python
  types: [shell]
  args: [-e, "SC1091,SC2250"]
  require_serial: true

- id: shfmt
  name: shfmt
  description: "Format shell scripts with shfmt"
  entry: shfmt -w
  language: golang
  language_version: "1.26.5"
  additional_dependencies: ["mvdan.cc/sh/v3/cmd/shfmt@v3.13.1"]
  types: [shell]
  require_serial: true

- id: cargo-fmt
  name: cargo fmt
  description: "Format every Rust package in the current Cargo workspace"
  entry: cargo fmt --all
  language: system
  types: [rust]
  pass_filenames: false
  require_serial: true

- id: cargo-clippy
  name: cargo clippy
  description: "Lint all workspace packages and targets with Clippy; reject warnings"
  entry: cargo clippy --workspace --all-targets
  args: ["--", "-D", "warnings", "-W", "clippy::cognitive_complexity", "-W", "clippy::excessive_nesting", "-W", "clippy::dbg_macro", "-W", "clippy::todo", "-W", "clippy::unimplemented"]
  language: system
  files: '(^|/)(.*\.rs|Cargo\.(toml|lock)|\.?clippy\.toml|rust-toolchain(\.toml)?)$'
  pass_filenames: false
  require_serial: true
