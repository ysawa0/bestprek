- id: ruff-check
  name: ruff check
  description: "Run 'ruff check' for extremely fast Python linting"
  entry: ruff check --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"

- id: ruff-format
  name: ruff format
  description: "Run 'ruff format' for extremely fast Python formatting"
  entry: ruff format --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"

- id: oxfmt
  name: oxfmt
  description: "Format JavaScript, JSX, TypeScript, TSX, and JSON files with oxfmt"
  entry: oxfmt --no-error-on-unmatched-pattern
  language: system
  types_or: [javascript, jsx, ts, tsx, json]
  pass_filenames: true

- id: unbold
  name: unbold
  description: "Strip markdown bold markers (** and __) in place"
  entry: unbold --write
  language: golang
  types: [markdown]
  require_serial: true

- id: rumdl
  name: rumdl check
  description: "Lint Markdown files using rumdl."
  entry: rumdl check
  language: python
  types: [markdown]
  require_serial: true

- id: rumdl-fmt
  name: rumdl format
  description: "Format Markdown files and fail if unfixable violations remain."
  entry: rumdl check --fix
  language: python
  types: [markdown]
  require_serial: true

- id: shellcheck
  name: shellcheck
  description: "Run shellcheck for shell script linting"
  entry: shellcheck
  language: system
  types: [shell]
  args: [-e, SC1091]
  require_serial: true

- id: shfmt
  name: shfmt
  description: "Format shell scripts with shfmt"
  entry: shfmt -w
  language: system
  types: [shell]
  require_serial: true
