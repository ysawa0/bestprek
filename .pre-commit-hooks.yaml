- id: ruff-check
  name: ruff check
  description: "Run 'ruff check' for extremely fast Python linting"
  entry: ruff check --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"

- id: ruff-format
  name: ruff format
  description: "Run 'ruff format' for extremely fast Python formatting"
  entry: ruff format --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  args: []
  require_serial: true
  additional_dependencies: []
  minimum_pre_commit_version: "2.9.2"

- id: unbold
  name: unbold
  description: "Strip markdown bold markers (** and __) in place"
  entry: unbold --write
  language: golang
  types: [markdown]
  require_serial: true

- id: mdformat
  name: mdformat
  description: "Format markdown with mdformat (commonly used in Google docs workflows)"
  entry: mdformat
  language: python
  types: [markdown]
  require_serial: true
  additional_dependencies: [mdformat]
  minimum_pre_commit_version: "2.9.2"

- id: shellcheck
  name: shellcheck
  description: "Run shellcheck for shell script linting"
  entry: shellcheck
  language: system
  types: [shell]
  args: [-e, SC1091]
  require_serial: true

- id: shfmt
  name: shfmt
  description: "Format shell scripts with shfmt"
  entry: shfmt -w
  language: system
  types: [shell]
  require_serial: true
